<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Macaúba Hortifruti</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Macaúba Hortifruti</p>
<h1>Leitor de pedidos</h1>
        </div>
        <div class="status-pill" id="statusResumo">Nenhum pedido enviado</div>
      </header>


      <section class="view active" id="admin">
        <aside class="panel">
          <h2>Novo pedido</h2>
          <label class="field">
            <span>Cliente</span>
            <input id="clienteInput" placeholder="Nome do cliente" />
          </label>
          <label class="field">
            <span>Pedido recebido</span>
            <textarea id="pedidoInput" placeholder="Cole aqui o pedido do cliente"></textarea>
          </label>
          <div class="actions">
            <button class="primary" id="interpretarBtn" type="button">Interpretar pedido</button>
            <label class="file-btn">
              Ler PDF
              <input id="pdfInput" type="file" accept=".pdf,application/pdf" />
            </label>
          </div>
          <button class="print-button" id="imprimirPedidoBtn" type="button">Imprimir pedido</button>
          <p class="hint" id="adminStatus">Aguardando pedido.</p>
        </aside>

        <section class="panel wide">
          <div class="section-title">
            <div>
              <span>Pedido interpretado</span>
              <strong id="adminCliente">Cliente não informado</strong>
            </div>
            <small id="adminQtd">0 item(ns)</small>
          </div>
          <div class="table-wrap">
            <table class="order-table">
              <thead>
                <tr>
                  <th>Produto</th>
                  <th>Quant.</th>
                  <th>Unidade</th>
                  <th>Peso real</th>
                  <th>Observação</th>
                </tr>
              </thead>
              <tbody id="adminTabela"></tbody>
            </table>
          </div>
        </section>
      </section>

    </main>
    <section class="print-area" id="printArea" aria-hidden="true"></section>

    <script src="./catalogo-produtos.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
